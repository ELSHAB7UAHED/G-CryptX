# .github/workflows/build-appimage.yml
name: Build G-CryptX AppImage

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system deps
      run: |
        sudo apt update
        sudo apt install -y python3-tk ffmpeg libasound2-dev

    - name: Install Python deps
      run: |
        pip install pyinstaller customtkinter cryptography pydub

    - name: Create icon
      run: |
        convert -size 256x256 -background black -fill '#00ff41' -gravity center -pointsize 100 label:"G\nC" G-CryptX.png

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --windowed --add-data="G-CryptX.png:." \
          --name=G-CryptX \
          --icon=G-CryptX.png \
          G-CryptX.py

    - name: Download AppImage tools
      run: |
        wget -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage
        chmod +x appimagetool

    - name: Prepare AppDir
      run: |
        mkdir -p G-CryptX.AppDir/usr/bin
        mkdir -p G-CryptX.AppDir/usr/share/icons/hicolor/256x256/apps
        cp dist/G-CryptX G-CryptX.AppDir/usr/bin/
        cp G-CryptX.png G-CryptX.AppDir/usr/share/icons/hicolor/256x256/apps/G-CryptX.png
        cat > G-CryptX.AppDir/G-CryptX.desktop <<EOF
[Desktop Entry]
Name=G-CryptX
Exec=G-CryptX
Icon=G-CryptX
Type=Application
Categories=Utility;Security;
Comment=Ghost Encryption Engine for Python Files
EOF

    - name: Build AppImage
      run: |
        ./appimagetool G-CryptX.AppDir

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: G-CryptX-Linux.AppImage
        path: G-CryptX*.AppImage
